:root{
  --sand:#f7f1e8; --card:#fffdf9; --ink:#1f2a2e; --muted:#6b7378; --line:#e7dccb;
  --ocean:#0f5e6e; --ocean-2:#0b4854; --coral:#e2725b; --leaf:#4f8a5b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--sand);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
.demo{background:var(--ink);color:#fff;font-size:12px;text-align:center;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top));letter-spacing:.02em}
header{background:linear-gradient(180deg,rgba(5,30,38,.35) 0%,rgba(5,30,38,.82) 100%),url(../img/hero.jpg) center 45%/cover;color:#fff;padding:0 0 26px;position:relative;overflow:hidden}
.brandbar{background:rgba(247,241,232,.95);color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
.brandbar a{color:inherit;text-decoration:none}
.htext{padding:56px 20px 0}

.top,h1,.lead,.where{position:relative;z-index:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:40px;height:40px;border-radius:12px;border:1.5px dashed rgba(255,255,255,.6);display:grid;place-items:center;font-size:9px;line-height:1.1;text-align:center;opacity:.9}
.hname{font-family:Fraunces,serif;font-size:19px;font-weight:600;line-height:1.1;white-space:nowrap}
.hsub{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px;white-space:nowrap}
.langs{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px}
.langs button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:6px 8px;border-radius:999px}
.langs button.on{background:var(--ink);color:#fff}
h1{font-family:Fraunces,serif;font-weight:500;font-size:34px;margin:22px 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.lead{opacity:.8;margin:0;font-size:14px}
.where{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500}
.where button{border:0;background:#fff;color:var(--ocean);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
nav{position:sticky;top:0;z-index:5;background:var(--sand);border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:500;white-space:nowrap}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters{padding:12px 16px 0}
.ftoggle{border:0;background:transparent;color:var(--ocean);font-weight:600;font-size:13px;padding:4px 0}
.fwrap{display:none;flex-wrap:wrap;gap:6px;margin-top:8px}
.fwrap.open{display:flex}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px}
.chip.on{background:#fbe6e1;border-color:var(--coral);color:#9b3a26;text-decoration:line-through}
.fnote{font-size:12px;color:var(--muted);width:100%;margin-top:2px}
main{padding:4px 16px}
section{padding-top:18px;scroll-margin-top:60px}
h2{font-family:Fraunces,serif;font-weight:500;font-size:22px;margin:4px 0 2px}
.hours{font-size:12px;color:var(--muted);margin-bottom:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px}
.item.hidden{display:none}
.ic{width:56px;height:56px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:28px;background:#f1e7d8}
.body{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.name{font-weight:600;font-size:15px}
.price{font-weight:600;white-space:nowrap;color:var(--ocean)}
.desc{color:var(--muted);font-size:13px;margin:3px 0 8px;line-height:1.4}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 6px}
.tag.pop{background:#fdebd3;color:#9a5a12}
.tag.veg{background:#e3f0e4;color:var(--leaf)}
.al{font-size:13px;cursor:help}
.qty{display:flex;align-items:center;gap:8px;margin-left:auto}
.qb{width:32px;height:32px;border-radius:50%;border:0;background:var(--ocean);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center}
.qb.minus{background:#e8eef0;color:var(--ocean)}
.qn{min-width:16px;text-align:center;font-weight:600}
.legend{margin:20px 0 10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.legend h3{margin:0 0 8px;font-size:14px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 0 4px}
/* ordering */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--sand) 30%)}
.bar .inner{display:flex;gap:8px;max-width:640px;margin:0 auto}
.svc{flex:none;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 12px;font-size:12px;font-weight:600;height:50px}
.cartbtn{flex:1;border:0;background:var(--coral);color:#fff;border-radius:14px;height:50px;font-weight:600;display:flex;justify-content:space-between;align-items:center;padding:0 16px;box-shadow:0 6px 18px rgba(226,114,91,.35)}
.cartbtn:disabled{background:#c9c2b8;box-shadow:none}
.badge{background:rgba(255,255,255,.25);border-radius:8px;padding:2px 8px;margin-right:8px}
.shade{position:fixed;inset:0;background:rgba(20,28,30,.45);z-index:20;display:none}
.shade.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:6px auto 12px}
.sheet h3{font-family:Fraunces,serif;font-weight:500;font-size:22px;margin:0 0 4px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}
.line .p{font-weight:600}
textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:#fff;margin-top:6px}
.locbox{margin-top:14px;background:#f6efe4;border-radius:14px;padding:12px}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:600}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#dn{font-size:18px;font-weight:600;margin-top:0}
#dn.bad{border-color:var(--coral);box-shadow:0 0 0 3px rgba(226,114,91,.2)}
.err{display:none;color:#b0442c;font-size:12px;margin-top:6px}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:17px;margin:14px 0}
.primary{width:100%;border:0;background:var(--ocean);color:#fff;border-radius:14px;height:52px;font-weight:600;font-size:16px}
.ghost{width:100%;border:0;background:transparent;color:var(--muted);height:44px;margin-top:4px}
.small{font-size:12px;color:var(--muted)}
.steps{margin:18px 0}
.st{display:flex;gap:12px;align-items:center;padding:10px 0;color:var(--muted)}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.st.done{color:var(--ink)} .st.done .dot{background:var(--leaf);border-color:var(--leaf);color:#fff}
.st.now{color:var(--ink);font-weight:600} .st.now .dot{border-color:var(--coral);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(226,114,91,.2)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:30;width:max-content;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.big{font-size:44px;text-align:center;margin:8px 0}
.center{text-align:center}
.item.so{opacity:.55}.soldout{margin-left:auto;font-size:12px;font-weight:700;color:var(--coral);border:1px solid var(--coral);border-radius:999px;padding:3px 10px}
</style>
</head>

function paintSteps(st){
  const order=["new","prep","way","done"], k=order.indexOf(st);
  [["#st1",0],["#st2",1],["#st3",2]].forEach(([sel,i])=>{const el=$(sel); if(!el) return;
    const done = i<k || (i===0) || st==="done";
    const now = !done && i===k;
    el.className="st"+(done?" done":now?" now":""); el.querySelector(".dot").textContent=done?"✓":"";});
  if(k===0){const el=$("#st2"); if(el) el.className="st now";}
}

/* ---------- live connection (Supabase) ---------- */
async function rpc(fn, body){
  const r = await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error(fn+" "+r.status);
  const txt = await r.text(); return txt ? JSON.parse(txt) : null;
}
let watchTimer = null;
async function pushOrder(order){
  for(let i=0;i<2;i++){
    try{ return await rpc("place_order",{p_loc_type:order.loc.type,p_loc_n:order.loc.n,p_items:order.items,p_note:order.note,p_total:order.total,p_lang:order.lang}); }
    catch(e){ await new Promise(r=>setTimeout(r,1200)); }
  }
  return null;
}
function watchOrder(id){
  clearInterval(watchTimer);
  watchTimer = setInterval(async()=>{
    if(!$("#st1")){ clearInterval(watchTimer); return; }
    try{ const st = await rpc("order_status",{p_id:id}); if(st){ paintSteps(st); if(st==="done") clearInterval(watchTimer); } }catch(e){}
  }, 8000);
}
async function pushCall(){
  try{ await rpc("place_call",{p_loc_type:loc.type,p_loc_n:String(loc.n)}); }catch(e){}
}

    const s=$("#kst"); s.className="status"+(isLive?"":" off"); s.querySelector("span").textContent = isLive?kt("live"):kt("offline");
    $("#klang").innerHTML = ["it","es","en"].map(l=>`<button class="${l===kl?"on":""}" data-kl="${l}">${l.toUpperCase()}</button>`).join("");
    $("#ksound").textContent = audio?kt("soundOn"):kt("sound"); $("#ksound").className="pill"+(audio?" on":"");
    $("#kout").textContent = kt("logout");
    const all=[...orders.values()];
    $("#kstats").innerHTML = `<div class="stat">${kt("today")}<b>${delivered.n}</b></div><div class="stat">${kt("revenue")}<b>${eur(delivered.sum)}</b></div><button class="cbtn" id="kclose">${kt("close")}</button><button class="cbtn ghost2" id="khist">${kt("hist")}</button>`;
    $("#kcalls").innerHTML = [...calls.entries()].sort((a,b)=>a[1].ts-b[1].ts).map(([id,c])=>`<div class="call">🛎 ${locTxt(c.loc)} ${kt("calls")} · <span class="ago">${ago(c.ts)}</span><button data-cd="${id}">${kt("ok")}</button></div>`).join("");
    $("#kcols").innerHTML = ["new","prep","way"].map(st=>{
      const list = all.filter(o=>o.status===st).sort((a,b)=>a.ts-b.ts);
      return `<div class="col"><h2>${kt(st)} <span>${list.length}</span></h2>${list.length?list.map(o=>card(o)).join(""):`<div class="emptyc">${kt("empty")}</div>`}</div>`;
    }).join("");
  }
  function card(o){
    const items=(o.items||[]).map(it=>`<div class="oi"><b>${+it.q||0}×</b>${nameOf(it)}</div>`).join("");
    const btn = o.status==="new"?kt("toPrep"):o.status==="prep"?kt("toWay"):kt("toDone");
    const note = o.note?`<div class="onote">📝 <b>${kt("note")}:</b> ${String(o.note).replace(/[<>&]/g,"")}</div>`:"";
    return `<div class="oc ${o.status} ${o._fresh?"fresh":""}"><div class="oh"><div class="where2">${locTxt(o.loc)}</div><div class="ago">${ago(o.ts)}</div></div>
      <div class="ono">#${+o.no||""} · ${kt("guestLang")}: ${(LN[o.lang]||"?")}</div>${items}${note}
      <div class="ofoot"><span></span><span>${eur(+o.total||0)}</span></div>
      <button class="adv" data-adv="${o._id}">${btn}</button></div>`;
  }
  function beep(){ if(!audio) return; try{ const now=audio.currentTime; [0,0.18].forEach((d,i)=>{const o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=i?1046:784; o.connect(g); g.connect(audio.destination); g.gain.setValueAtTime(.0001,now+d); g.gain.exponentialRampToValueAtTime(.3,now+d+.02); g.gain.exponentialRampToValueAtTime(.0001,now+d+.35); o.start(now+d); o.stop(now+d+.4);}); }catch(e){} }

  function upsert(id,o,isNew){ const prev=orders.get(id); o._id=id; o._fresh = !prev && isNew; orders.set(id,o); if(!prev && isNew && o.status==="new") beep(); }

  let PIN = (()=>{try{return localStorage.getItem("k-pin")}catch(e){return null}})();
  let firstLoad = true;
  async function load(){
    if(!PIN) return;
    let r;
    try{ r = await rpc("kitchen_feed",{p_pin:PIN}); }catch(e){ isLive=false; paint(); return; }
    if(r && r.error){ PIN=null; try{localStorage.removeItem("k-pin")}catch(_){} pinScreen(r.error==="locked"?kt("pinLocked"):kt("pinBad")); return; }
    isLive=true;
    const seen=new Set();
    (r.orders||[]).forEach(x=>{ seen.add(x.id); const prev=orders.get(x.id);
      const o={no:x.no,loc:{type:x.loc_type,n:x.loc_n},items:x.items,note:x.note,total:+x.total,status:x.status,ts:Date.parse(x.created_at),lang:x.lang};
      if(prev && prev._pending && prev.status!==o.status) o.status=prev.status, o._pending=true;
      upsert(x.id,o,!firstLoad); });
    [...orders.keys()].forEach(k=>{ if(!seen.has(k)) orders.delete(k); });
    const before=calls.size, had=new Set(calls.keys()); calls.clear();
    let newCall=false;
    (r.calls||[]).forEach(c=>{ calls.set(c.id,{loc:{type:c.loc_type,n:c.loc_n},ts:Date.parse(c.created_at)}); if(!had.has(c.id)) newCall=true; });
    if(newCall && !firstLoad) beep();
    delivered={n:+r.done_n||0,sum:+r.done_sum||0};
    firstLoad=false; paint();
  }
  async function setStatus(id, st){
    const o=orders.get(id); if(!o) return;
    o.status=st; o._fresh=false; o._pending=true;
    if(st==="done"){ orders.delete(id); delivered.n++; delivered.sum+=(+o.total||0); }
    paint();
    try{ await rpc("kitchen_set_status",{p_pin:PIN,p_id:id,p_status:st}); }catch(e){}
    o._pending=false; load();
  }
  const fmtT = ts => { try{ return new Date(ts).toLocaleString(kl==="es"?"es-ES":kl==="en"?"en-GB":"it-IT",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit",timeZone:"Atlantic/Canary"}); }catch(e){ return ""; } };
  function overlay(html){ const d=document.createElement("div"); d.className="kov"; d.innerHTML=`<div class="kbox">${html}</div>`; document.body.appendChild(d); return d; }
  function summaryHTML(r){
    const items=(r.items||[]).map(it=>`<div class="ln"><span>${nameOf(it)}</span><b>${+it.q||0}×</b></div>`).join("");
    return `<h3>🧾 ${kt("closed")}</h3><div class="sub">${kt("shift")}: ${fmtT(r.from_ts||r.from)} → ${fmtT(r.to_ts||r.to)} · ${kt("qrOnly")}</div>
      <div class="big2"><div>${kt("ordersN")}<b>${+r.n||0}</b></div><div>${kt("total")}<b>${eur(+r.total||0)}</b></div></div>
      ${items?`<div class="sub" style="margin-top:12px;font-weight:600">${kt("sold")}</div>${items}`:""}
      <div class="bb"><button data-kprint>${kt("print")}</button><button class="pri" data-kx>${kt("closeBtn")}</button></div>`;
  }
  function closeAsk(){
    const d=overlay(`<h3>🧾 ${kt("close").replace("🧾 ","")}</h3><p>${kt("closeQ")}</p>
      <div class="big2"><div>${kt("today")}<b>${delivered.n}</b></div><div>${kt("revenue")}<b>${eur(delivered.sum)}</b></div></div>
      <div class="bb"><button data-kx>${kt("cancel")}</button><button class="pri" id="kcy">${kt("closeYes")}</button></div>`);
    d.querySelector("#kcy").onclick=async()=>{
      d.querySelector("#kcy").disabled=true;
      try{ const r=await rpc("kitchen_close_shift",{p_pin:PIN}); if(r && r.error) throw 0; d.remove(); overlay(summaryHTML(r)); load(); }
      catch(e){ d.querySelector("#kcy").disabled=false; }
    };
  }
  async function history(){
    let r; try{ r=await rpc("kitchen_closures",{p_pin:PIN}); }catch(e){ return; }
    const list=(r&&r.list)||[];
    const d=overlay(`<h3>${kt("hist")}</h3>${list.length?list.map((c,i)=>`<div class="ln" style="cursor:pointer" data-hi="${i}"><span>${fmtT(c.from_ts)} → ${fmtT(c.to_ts)}</span><b>${c.n} · ${eur(+c.total)}</b></div>`).join(""):`<p class="sub">${kt("noHist")}</p>`}
      <div class="bb"><button id="kreset">${kt("reset")}</button><button class="pri" data-kx>${kt("closeBtn")}</button></div>`);
    const rb=d.querySelector("#kreset");
    rb.onclick=async()=>{
      if(rb.dataset.sure!=="1"){ rb.dataset.sure="1"; rb.textContent="⚠️ "+kt("resetYes"); rb.style.background="var(--coral)"; rb.style.color="#fff";
        const p=document.createElement("p"); p.className="sub"; p.textContent=kt("resetQ"); rb.parentNode.before(p); return; }
      rb.disabled=true;
      try{ const r=await rpc("kitchen_reset_history",{p_pin:PIN}); if(r && r.error) throw 0; d.remove(); load(); history(); }catch(e){ rb.disabled=false; }
    };
    d.querySelectorAll("[data-hi]").forEach(el=>el.onclick=()=>{ d.remove(); overlay(summaryHTML(list[+el.dataset.hi])); });
  }
  function pinScreen(msg){
    $("#kcols").innerHTML = `<div style="grid-column:1/-1;max-width:320px;margin:40px auto;text-align:center">
      <h2 style="font-family:Fraunces,serif;font-size:24px;margin:0 0 14px">🔒 ${kt("pin")}</h2>
      <input id="kpin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" style="width:100%;font-size:28px;text-align:center;letter-spacing:.3em;padding:12px;border-radius:14px;border:1px solid #cfd6d9">
      <div style="color:var(--coral);min-height:22px;margin-top:8px;font-weight:600">${msg||""}</div>
      <button class="adv" id="kgo">${kt("enter")}</button></div>`;
    $("#kstats").innerHTML=""; $("#kcalls").innerHTML="";
    const go=()=>{ const v=$("#kpin").value.trim(); if(!v) return; PIN=v; try{localStorage.setItem("k-pin",v)}catch(_){} firstLoad=true; $("#kcols").innerHTML=""; load(); };
    $("#kgo").onclick=go; $("#kpin").onkeydown=e=>{ if(e.key==="Enter") go(); }; $("#kpin").focus();
  }

  document.addEventListener("click",async e=>{
    const l=e.target.closest("[data-kl]"); if(l){kl=l.dataset.kl; try{localStorage.setItem("k-lang",kl)}catch(_){} if(PIN) paint(); else {paint(); pinScreen();} return}
    if(e.target.closest("#ksound")){ try{ audio = audio || new (window.AudioContext||window.webkitAudioContext)(); await audio.resume(); beep(); }catch(_){ audio=null } paint(); if(!PIN) pinScreen(); return}
    if(e.target.closest("#kout")){ PIN=null; try{localStorage.removeItem("k-pin")}catch(_){} orders.clear(); calls.clear(); paint(); pinScreen(); return}
    if(e.target.closest("#kclose")){ closeAsk(); return}
    if(e.target.closest("#khist")){ history(); return}
    if(e.target.closest("[data-kx]")){ e.target.closest(".kov").remove(); return}
    if(e.target.closest("[data-kprint]")){ window.print(); return}
    const a=e.target.closest("[data-adv]"); if(a){ const o=orders.get(a.dataset.adv); if(!o) return; setStatus(o._id, o.status==="new"?"prep":o.status==="prep"?"way":"done"); return}
    const c=e.target.closest("[data-cd]"); if(c){ const id=c.dataset.cd; calls.delete(id); paint(); try{ await rpc("kitchen_clear_call",{p_pin:PIN,p_id:id}); }catch(_){} return}
  });

  // tieni lo schermo acceso sul tablet
  async function keepAwake(){ try{ if(navigator.wakeLock) await navigator.wakeLock.request("screen"); }catch(e){} }
  keepAwake(); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ keepAwake(); load(); } });

  paint();
  if(PIN) load(); else pinScreen();
  setInterval(()=>{ if(PIN) load(); }, 4000);
  setInterval(()=>{ if(PIN) paint(); }, 30000);
}

      <div class="g3">
        <div><label>${at("cat")}</label><select id="fc">${CATS.map(c=>`<option value="${c.id}" ${c.id===v.c?"selected":""}>${c.e} ${esc(c.n[kl]||c.n.it)}</option>`).join("")}</select></div>
        <div><label>${at("price")}</label><input id="fp" inputmode="decimal" value="${v.p===""?"":String(v.p).replace(".",",")}"></div>
        <div><label>${at("icon")}</label><input id="fi" maxlength="4" value="${esc(v.i)}"></div>
      </div>
      <label>${at("alg")}</label><div class="chips">${Object.entries(AL).map(([k,a])=>`<label><input type="checkbox" data-fa="${k}" ${v.a.includes(k)?"checked":""}> ${a.e} ${a[kl]||a.it}</label>`).join("")}</div>
      <label>${at("tags")}</label><div class="chips">
        <label><input type="checkbox" data-ft="pop" ${v.t.includes("pop")?"checked":""}> ★ ${UI.pop[kl]||UI.pop.it}</label>
        <label><input type="checkbox" data-ft="veg" ${v.t.includes("veg")?"checked":""}> 🌱 ${UI.veg[kl]||UI.veg.it}</label>
        ${UI.vegan?`<label><input type="checkbox" data-ft="vegan" ${v.t.includes("vegan")?"checked":""}> 🌱 ${UI.vegan[kl]||UI.vegan.it}</label>`:""}</div>
      <details ${others.some(l=>v.n[l]||v.d[l])?"":""}><summary>${at("other")}</summary>
        ${others.map(l=>`<label>${at("name")} (${LNAME[l]})</label><input id="fn_${l}" maxlength="80" value="${esc(v.n[l]||"")}">
          <label>${at("desc")} (${LNAME[l]})</label><textarea id="fd_${l}" rows="2" maxlength="200">${esc(v.d[l]||"")}</textarea>`).join("")}
      </details>
      <div class="er" id="fer"></div>
      <div class="fb"><button class="c" id="fx">${at("cancel")}</button><button class="s" id="fs">${at("save")}</button></div>
      ${isNew?"":`<button class="dl" id="fdel">🗑 ${at("del")}</button>`}
    </div>`;
    document.body.appendChild(ov);
    const read = ()=>{ LN4.forEach(l=>{ const a=ov.querySelector("#fn_"+l), b=ov.querySelector("#fd_"+l); if(a) v.n[l]=a.value.trim(); if(b) v.d[l]=b.value.trim(); });
      v.c=ov.querySelector("#fc").value; v.i=ov.querySelector("#fi").value.trim()||"🍽";
      v.p=ov.querySelector("#fp").value.trim().replace(",",".");
      v.a=[...ov.querySelectorAll("[data-fa]:checked")].map(x=>x.dataset.fa); v.t=[...ov.querySelectorAll("[data-ft]:checked")].map(x=>x.dataset.ft); };
    ov.querySelectorAll("[data-ml]").forEach(b=>b.onclick=()=>{ read(); main=b.dataset.ml; ov.remove(); form(Object.assign({},v,{id:v.id===null?undefined:v.id,p:v.p===""?"":+v.p})); });
    ov.querySelector("#fx").onclick=()=>ov.remove();
    ov.querySelector("#fs").onclick=async()=>{
      read(); const er=ov.querySelector("#fer");
      if(!LN4.some(l=>v.n[l])){ er.textContent=at("needName"); return; }
      const pr=parseFloat(v.p); if(!(pr>=0 && pr<1000)){ er.textContent=at("needPrice"); return; }
      const item={id:v.id,c:v.c,i:v.i,p:Math.round(pr*100)/100,a:v.a,t:v.t,n:clean(v.n),d:clean(v.d),av:v.av};
      ov.querySelector("#fs").disabled=true;
      try{ await call("admin_save_item",{p_item:item}); await loadMenu(); ov.remove(); list(); toastA(at("saved")); }
      catch(e){ if(e.message!=="pin"){ er.textContent=at("err"); ov.querySelector("#fs").disabled=false; } else ov.remove(); }
    };
    const dl=ov.querySelector("#fdel");
    if(dl) dl.onclick=async()=>{
      if(dl.dataset.sure!=="1"){ dl.dataset.sure="1"; dl.textContent="⚠️ "+at("delQ")+" → "+at("yesDel"); return; }
      try{ await call("admin_delete_item",{p_id:v.id}); await loadMenu(); ov.remove(); list(); toastA(at("saved")); }catch(e){ ov.querySelector("#fer").textContent=at("err"); }
    };
  }
  const clean = o => { const r={}; Object.entries(o).forEach(([k,x])=>{ if(x) r[k]=x; }); return r; };

  document.addEventListener("click", async e=>{
    const l=e.target.closest("[data-al]"); if(l){ kl=l.dataset.al; main = kl==="es"?"es":"it"; try{localStorage.setItem("k-lang",kl)}catch(_){} PIN?list():pinScreen(); return; }
    const av=e.target.closest("[data-av]"); if(av){ const m=byId(av.dataset.av); if(!m) return; m.av=!m.av; list();
      try{ await call("admin_set_available",{p_id:m.id,p_av:m.av}); toastA(at("saved")); }catch(err){ m.av=!m.av; list(); if(err.message!=="pin") toastA(at("err")); } return; }
    const ed=e.target.closest("[data-ed]"); if(ed){ const m=byId(ed.dataset.ed); if(m) form(m); return; }
    const ad=e.target.closest("[data-add]"); if(ad){ form({c:ad.dataset.add,i:"🍽",a:[],t:[],n:{},d:{},av:true}); return; }
    const mv=e.target.closest("[data-mv]"); if(mv){ try{ await call("admin_move_item",{p_id:+mv.dataset.mv,p_dir:+mv.dataset.d}); await loadMenu(); list(); }catch(err){} return; }
  });

  header();
  if(!PIN){ pinScreen(); return; }
  $("#aw").innerHTML = `<p class="hint">…</p>`;
  loadMenu().then(()=>list());
}

const MODE = location.hash==="#gestione" ? "admin" : location.hash==="#cucina" ? "kitchen" : "menu";
window.addEventListener("hashchange",()=>{ const m = location.hash==="#gestione" ? "admin" : location.hash==="#cucina" ? "kitchen" : "menu"; if(m!==MODE) location.reload(); });
if(MODE!=="menu"){
  // app installabile "Carmensita Bar" (solo per il personale: tablet ordini e gestione menù)
  const addH=(tag,attrs)=>{ const el=document.createElement(tag); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); document.head.appendChild(el); };
  addH("link",{rel:"manifest",href:"/app/manifest.webmanifest"});
  addH("link",{rel:"apple-touch-icon",href:"/app/apple-touch-icon.png"});
  addH("meta",{name:"apple-mobile-web-app-capable",content:"yes"});
  addH("meta",{name:"mobile-web-app-capable",content:"yes"});
  addH("meta",{name:"apple-mobile-web-app-title",content:"Carmensita Bar"});
  addH("meta",{name:"apple-mobile-web-app-status-bar-style",content:"black-translucent"});
  addH("meta",{name:"theme-color",content:"#1f2a2e"});
  document.title = "Carmensita Bar";
  if("serviceWorker" in navigator) navigator.serviceWorker.register("/menu/sw.js",{scope:"/menu/"}).catch(()=>{});
  window.addEventListener("beforeinstallprompt", ev=>{ ev.preventDefault(); window._instEv=ev;
    const add=()=>{ const h=document.querySelector(".kh"); if(!h){ return setTimeout(add,500); } if(document.getElementById("kinst")) return;
      const b=document.createElement("button"); b.id="kinst"; b.className="pill"; b.style.background="#F2B880"; b.style.color="#1f2a2e"; b.textContent="📲 Installa app";
      b.onclick=async()=>{ try{ window._instEv.prompt(); await window._instEv.userChoice; }catch(e){} b.remove(); };
      h.insertBefore(b, h.querySelector(".langs")); };
    add(); });
}
if(MODE==="admin"){
  admin();
} else if(MODE==="kitchen"){
  loadMenu();
  kitchen();
} else {
loc = parseHash();
window.addEventListener("hashchange",()=>{const p=parseHash(); if(p){loc=p; renderWhere();}});
render(); observe();
loadMenu().then(ok=>{ if(ok) render(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") loadMenu().then(ok=>{ if(ok){ render(); renderBar(); } }); });
}
const _rm = renderMain; renderMain = function(){_rm(); observe();};
</script>
</body>
